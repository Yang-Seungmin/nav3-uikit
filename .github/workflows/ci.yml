name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # The iOS targets compile only on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: >-
          ./gradlew
          :nav3-uikit:compileKotlinIosSimulatorArm64
          :nav3-uikit:compileKotlinJvm
          :nav3-uikit:compileAndroidMain
          :nav3-uikit:jvmTest
