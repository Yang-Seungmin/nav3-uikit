name: UI tests

# About 30 minutes on a hosted runner, so it runs on demand rather than on every pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Generate the Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcrun simctl list runtimes
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: Run the UI tests
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/ui-tests.xcresult \
            test

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-tests-xcresult
          path: build/ui-tests.xcresult
          if-no-files-found: ignore
